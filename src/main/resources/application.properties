spring.application.name=billetterie

# Base MySQL (valeurs de développement, surchargeables par variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billetterie}
spring.datasource.username=${DB_USER:billetterie}
spring.datasource.password=${DB_PASSWORD:billetterie}

# Le schéma vient uniquement de Flyway : Hibernate ne fait que le valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Exploitation : seul /actuator/health est exposé, sans détails
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI et Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Pas de trace de pile dans les réponses d'erreur
server.error.include-stacktrace=never
server.error.include-message=never
