<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${concert.titre})}"></head>
<body>
<header th:replace="~{fragments/layout :: entete}"></header>
<main>
    <p><a th:href="@{/concerts}">&larr; Tous les concerts</a></p>
    <div class="carte">
        <h1 th:text="${concert.titre}">Titre</h1>
        <p><strong>Artiste :</strong> <span th:text="${concert.artiste}">Artiste</span></p>
        <p><strong>Salle :</strong> <span th:text="${concert.salle} + ' (' + ${concert.ville} + ')'">Salle</span></p>
        <p><strong>Date :</strong> <span th:text="${#temporals.format(concert.dateHeure, 'dd/MM/yyyy HH:mm')}">Date</span></p>
        <p><strong>Prix unitaire :</strong> <span th:text="${#numbers.formatDecimal(concert.prixUnitaire, 1, 2)} + ' €'">Prix</span></p>
        <p><strong>Places restantes :</strong>
            <span th:text="${concert.placesRestantes} + ' sur ' + ${concert.capacite}">0 sur 0</span></p>
        <p class="erreur" th:if="${concert.placesRestantes == 0}">Ce concert est complet.</p>
        <p class="erreur" th:if="${erreurAchat}" th:text="${erreurAchat}">Erreur d'achat</p>
        <div th:if="${concert.placesRestantes > 0}">
            <form th:if="${compte != null and compte.clientId != null}" class="achat" method="post"
                  th:action="@{/concerts/{id}/achat(id=${concert.id})}">
                <label>Nombre de billets (1 à 6)
                    <input type="number" name="quantite" min="1" max="6" value="1" required>
                </label>
                <button type="submit">Acheter</button>
            </form>
            <p th:if="${compte != null and compte.clientId == null}" class="vide">
                Seul un compte client peut acheter des billets.</p>
            <p th:if="${compte == null}">
                <a th:href="@{/connexion}">Connectez-vous</a> avec un compte client pour acheter des billets.</p>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: pied}"></footer>
</body>
</html>
