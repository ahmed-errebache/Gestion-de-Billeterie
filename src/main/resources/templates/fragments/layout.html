<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' - Billetterie'">Billetterie</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="entete" th:fragment="entete">
    <a class="marque" th:href="@{/concerts}">Billetterie de concerts</a>
    <a th:href="@{/concerts}">Concerts</a>
    <a th:href="@{/inscription}">Inscription</a>
    <a th:if="${compte != null and compte.clientId != null}" th:href="@{/espace}">Mon espace</a>
    <a th:if="${compte == null}" th:href="@{/connexion}">Connexion</a>
    <form th:if="${compte != null}" class="deconnexion" method="post" th:action="@{/deconnexion}">
        <button type="submit" th:text="'Déconnexion (' + ${compte.username} + ')'">Déconnexion</button>
    </form>
</header>
<footer class="pied" th:fragment="pied">
    BUT3 Informatique - R5.08 Qualité du développement
</footer>
</body>
</html>
